name: Update Oracle CVE tracker

# Oracle ships its Critical Patch Update quarterly, but out-of-band security
# alerts appear at any time, so we check daily rather than on a CPU calendar.
on:
  schedule:
    # 06:20 UTC. Avoid the top of the hour: scheduled jobs queue heavily there
    # and GitHub may delay or drop them under load.
    - cron: '20 6 * * *'

  # Lets you trigger a run by hand, including a historical backfill.
  workflow_dispatch:
    inputs:
      mode:
        description: 'delta (recent changes) or backfill (historical range)'
        type: choice
        options: [delta, backfill]
        default: delta
      since:
        description: 'Backfill start date, YYYY-MM-DD'
        type: string
      force:
        description: 'Rewrite pages even when unchanged'
        type: boolean
        default: false

# The job writes to the repository, so it needs write access to contents.
# Everything else stays at no permission, which is the least-privilege default.
permissions:
  contents: write

# Two concurrent runs would race on the same commit and one would fail to push.
concurrency:
  group: update-cves
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No dependency install step: the script uses only the standard library,
      # so there is nothing to pip install and no supply chain to audit.

      - name: Fetch critical Oracle CVEs
        env:
          # Optional. Raises the NVD rate limit from 5 to 50 requests per 30s.
          # Request one at https://nvd.nist.gov/developers/request-an-api-key
          # and store it as a repository secret; never commit it.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Makes the links in generated pages point at this repository.
          TRACKER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=(--mode "${{ inputs.mode || 'delta' }}")

          # Two days of overlap in delta mode, so a single failed or skipped
          # run cannot leave a permanent gap in coverage.
          if [ "${{ inputs.mode || 'delta' }}" = "delta" ]; then
            ARGS+=(--days 2)
          else
            if [ -z "${{ inputs.since }}" ]; then
              echo "::error::backfill mode requires a 'since' date"
              exit 1
            fi
            ARGS+=(--since "${{ inputs.since }}")
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi

          python3 scripts/fetch_oracle_cves.py "${ARGS[@]}"

      - name: Commit any new or changed pages
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Committing with no staged changes exits non-zero and would mark the
          # run as failed, so check first and exit cleanly when nothing changed.
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git add -A
          COUNT=$(git diff --cached --name-only | grep -c 'README.md$' || true)
          git commit -m "chore: sync critical Oracle CVEs (${COUNT} pages changed)"

          # Another run may have pushed while this one worked; rebase rather
          # than force-push so no commit is discarded.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

name: Update Oracle CVE tracker

on:
  schedule:
    - cron: '20 6 * * *'
    - cron: '40 7 * * 1'
    - cron: '10 20-23 * * 2'
    - cron: '10 0-3 * * 3'

  workflow_dispatch:
    inputs:
      mode:
        description: 'delta (recent changes) or backfill (historical range)'
        type: choice
        options: [delta, backfill]
        default: delta
      since:
        description: 'Backfill start date, YYYY-MM-DD'
        type: string
      force:
        description: 'Rewrite pages even when unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-cves
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DAILY_CRON: '20 6 * * *'
      RECONCILE_CRON: '40 7 * * 1'
      RECONCILE_WINDOW_DAYS: '60'
      DELTA_OVERLAP_DAYS: '2'
      PATCH_DOM_FIRST: '14'
      PATCH_DOM_LAST: '21'
      HEARTBEAT_FILE: '.github/heartbeat.txt'
      HEARTBEAT_AFTER_DAYS: '30'

    steps:
      - name: Decide whether this run should do any work
        id: window
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          case "${TRIGGER_CRON:-}" in
            ''|"$DAILY_CRON"|"$RECONCILE_CRON")
              echo 'proceed=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          WEEKDAY=$(TZ=America/Los_Angeles date '+%u')
          DAY_OF_MONTH=$(TZ=America/Los_Angeles date '+%-d')

          if [ "$WEEKDAY" = '2' ] \
             && [ "$DAY_OF_MONTH" -ge "$PATCH_DOM_FIRST" ] \
             && [ "$DAY_OF_MONTH" -le "$PATCH_DOM_LAST" ]; then
            echo "Patch Tuesday in Pacific time (the ${DAY_OF_MONTH}th); checking for new CVEs."
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo "Pacific weekday ${WEEKDAY}, day ${DAY_OF_MONTH}: not a patch Tuesday, nothing to do."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.window.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.window.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch critical Oracle CVEs
        if: steps.window.outputs.proceed == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_FORCE: ${{ inputs.force }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          MODE="${INPUT_MODE:-}"
          SINCE="${INPUT_SINCE:-}"

          if [ -z "$MODE" ]; then
            if [ "${TRIGGER_CRON:-}" = "$RECONCILE_CRON" ]; then
              MODE=backfill
              SINCE=$(date -u -d "${RECONCILE_WINDOW_DAYS} days ago" '+%Y-%m-%d')
              echo "Weekly reconcile: re-checking Oracle CVEs since ${SINCE}."
            else
              MODE=delta
            fi
          fi

          ARGS=(--mode "$MODE")

          if [ "$MODE" = 'delta' ]; then
            ARGS+=(--days "$DELTA_OVERLAP_DAYS")
          else
            if [ -z "$SINCE" ]; then
              echo "::error::backfill mode requires a 'since' date"
              exit 1
            fi
            ARGS+=(--since "$SINCE")
          fi

          if [ "${INPUT_FORCE:-false}" = 'true' ]; then
            ARGS+=(--force)
          fi

          python3 scripts/fetch_oracle_cves.py "${ARGS[@]}"

      - name: Commit any new or changed pages
        if: steps.window.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add -A

          if ! git diff --cached --quiet; then
            COUNT=$(git diff --cached --name-only | grep -c 'README.md$' || true)
            MESSAGE="chore: sync critical Oracle CVEs (${COUNT} pages changed)"
          else
            QUIET_DAYS=$(( ( $(date -u '+%s') - $(git log -1 --format='%ct') ) / 86400 ))
            if [ "$QUIET_DAYS" -lt "$HEARTBEAT_AFTER_DAYS" ]; then
              echo "No changes to commit; last commit was ${QUIET_DAYS} day(s) ago."
              exit 0
            fi
            printf '%s\n' \
              'Touched by the update-cves workflow so GitHub keeps its schedules enabled.' \
              "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$HEARTBEAT_FILE"
            git add "$HEARTBEAT_FILE"
            MESSAGE="chore: keep scheduled runs alive after ${QUIET_DAYS} quiet days"
          fi

          git commit -m "$MESSAGE"

          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
